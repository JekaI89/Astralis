services:
  - type: web
    name: astralis-web
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: pnpm install && pnpm --filter @astralis/types build && pnpm --filter @astralis/core build && pnpm --filter @astralis/web build
    startCommand: pnpm --filter @astralis/web start
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: web
    name: astralis-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: pnpm install && pnpm --filter @astralis/types build && pnpm --filter @astralis/core build && pnpm --filter @astralis/api build && pnpm --filter @astralis/api exec prisma generate
    startCommand: pnpm --filter @astralis/api start
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: worker
    name: astralis-bot
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: pnpm install && pnpm --filter @astralis/types build && pnpm --filter @astralis/bot build
    startCommand: pnpm --filter @astralis/bot start
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
